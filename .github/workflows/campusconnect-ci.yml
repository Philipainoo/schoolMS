name: CampusConnect CI

on:
  push:
    branches: [campusconnect-conversion, campusconnect-messaging-enhancements, campusconnect-message-read-receipts, campusconnect-group-member-management, campusconnect-typing-indicators, campusconnect-message-edit-delete, campusconnect-group-chat-settings, campusconnect-group-profiles, campusconnect-message-reactions-replies]
    paths:
      - "campusconnect/**"
      - ".github/workflows/campusconnect-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "campusconnect/**"
      - ".github/workflows/campusconnect-ci.yml"

jobs:
  web-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: campusconnect
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://jfwnudfdiuopdsjqakku.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-build-placeholder
